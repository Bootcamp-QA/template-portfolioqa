name: Automated API tests with Postman CLI + Newman

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Clonar el repositorio
      - uses: actions/checkout@v4

      # 2️⃣ Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ Instalar Newman y reporter HTML
      - name: Install Newman
        run: |
          npm install -g newman newman-reporter-html

      # 4️⃣ Instalar Postman CLI
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      # 5️⃣ Login al Postman CLI
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      # 6️⃣ Descargar colección y environment desde Postman
      - name: Download Collection and Environment
        run: |
          postman collection get "33801345-181c803c-a263-4988-9141-4482d833eb4c" --output collection.json
          postman environment get "33801345-e08ef3e0-e06f-4b5c-936b-179df25cea75" --output environment.json

      # 7️⃣ Ejecutar Newman con HTML Reporter
      - name: Run API tests and generate HTML report
        run: |
          newman run collection.json -e environment.json -r html --reporter-html-export report.html

      # 8️⃣ Subir HTML como artefacto
      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: report.html

